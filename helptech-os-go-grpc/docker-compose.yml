services:
  postgres:
    image: postgres:16-alpine
    container_name: helptech-postgres
    environment:
      POSTGRES_DB: helptech_os
      POSTGRES_USER: helptech
      POSTGRES_PASSWORD: helptech123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helptech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helptech -d helptech_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: helptech-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@helptech.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helptech-network

  auth-service:
    build: ./auth-service
    container_name: helptech-auth-service
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helptech-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  cliente-service:
    build: ./cliente-service
    container_name: helptech-cliente-service
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helptech-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ordem-service:
    build: ./ordem-service
    container_name: helptech-ordem-service
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helptech-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  financeiro-service:
    build: ./financeiro-service
    container_name: helptech-financeiro-service
    env_file: .env
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helptech-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: helptech-api-gateway
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      cliente-service:
        condition: service_healthy
      ordem-service:
        condition: service_healthy
      financeiro-service:
        condition: service_healthy
    networks:
      - helptech-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  helptech-network:
    name: helptech-network

volumes:
  postgres_data:
